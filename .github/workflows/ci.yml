name: Monorepo CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  contracts-checks:
    name: Soroban Smart Contracts Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Verify Contract Formatting
        run: |
          cd contracts
          cargo fmt --check

      - name: Run Cargo Check
        run: |
          cd contracts
          cargo check

      - name: Run Clippy Linter
        run: |
          cd contracts
          cargo clippy --all-targets -- -D warnings

      - name: Run Contract Unit & Lifecycle Tests
        run: |
          cd contracts
          cargo test

      - name: Build Contract WASM
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release

      - name: Install Soroban / Stellar CLI
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.local/bin"
          if curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v22.0.1/stellar-cli-22.0.1-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"; then
            if [ -f "$HOME/.local/bin/stellar" ]; then
              ln -sf "$HOME/.local/bin/stellar" "$HOME/.local/bin/soroban"
            fi
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Optimize Contract WASM
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd contracts
          if command -v soroban >/dev/null 2>&1; then
            echo "Optimizing WASM with soroban contract optimize..."
            soroban contract optimize --wasm target/wasm32-unknown-unknown/release/soroban_anchor_escrow.wasm
          elif command -v stellar >/dev/null 2>&1; then
            echo "Optimizing WASM with stellar contract optimize..."
            stellar contract optimize --wasm target/wasm32-unknown-unknown/release/soroban_anchor_escrow.wasm
          else
            echo "Soroban/Stellar CLI not available, executing fallback optimization check..."
            cp target/wasm32-unknown-unknown/release/soroban_anchor_escrow.wasm target/wasm32-unknown-unknown/release/soroban_anchor_escrow.optimized.wasm
          fi

      - name: Assert Optimized WASM Size Limits (<64KB)
        run: |
          MAX_SIZE=$((64 * 1024))
          WASM_FILE="contracts/target/wasm32-unknown-unknown/release/soroban_anchor_escrow.optimized.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            WASM_FILE="contracts/target/wasm32-unknown-unknown/release/soroban_anchor_escrow.wasm"
          fi
          ACTUAL_SIZE=$(stat -c%s "$WASM_FILE" 2>/dev/null || stat -f%z "$WASM_FILE")
          echo "Optimized WASM size: $ACTUAL_SIZE bytes (limit: $MAX_SIZE bytes / 64KB)"
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: WASM size ($ACTUAL_SIZE bytes) exceeds maximum limit of $MAX_SIZE bytes (64KB)"
            exit 1
          fi
          echo "WASM size limit check passed ($ACTUAL_SIZE < $MAX_SIZE bytes)."

      - name: Compute Build Checksums
        run: |
          cd contracts/target/wasm32-unknown-unknown/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum soroban_anchor_escrow*.wasm > checksums.sha256
          else
            shasum -a 256 soroban_anchor_escrow*.wasm > checksums.sha256
          fi
          cat checksums.sha256

      - name: Archive WASM Build Artifacts and Checksums
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contracts-wasm
          path: |
            contracts/target/wasm32-unknown-unknown/release/*.wasm
            contracts/target/wasm32-unknown-unknown/release/checksums.sha256
          retention-days: 30

  contract-client-checks:
    name: TypeScript Contract Client SDK Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install SDK Dependencies
        run: |
          cd packages/contract-client
          npm ci

      - name: Run SDK Typecheck
        run: |
          cd packages/contract-client
          npm run typecheck

      - name: Run SDK Unit Tests
        run: |
          cd packages/contract-client
          npm run test

      - name: Build SDK
        run: |
          cd packages/contract-client
          npm run build

  web-frontend-checks:
    name: Next.js Web Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint Verification
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript Typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Web Unit Tests
        run: |
          cd apps/web
          npm run test

      - name: Production Next.js Build
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CBIHLECKLMXYK6FPHSGGVYF6AHNFRHR3T5EIFIS3PFQDFKDQWNR25PHT
        run: |
          cd apps/web
          npm run build

  go-relay-checks:
    name: Go Relay Service Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: services/relay/go.sum

      - name: Verify Go Formatting
        run: |
          cd services/relay
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd services/relay
          go vet ./...

      - name: Run Go Tests & Race Detector
        run: |
          cd services/relay
          go test -v -race ./...

      - name: Build Relay Daemon Executable
        run: |
          cd services/relay
          go build ./cmd/relay/main.go
