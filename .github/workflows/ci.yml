name: Monorepo CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  contracts-checks:
    name: Soroban Smart Contracts Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Verify Contract Formatting
        run: |
          cd contracts
          cargo fmt --check

      - name: Run Cargo Check
        run: |
          cd contracts
          cargo check

      - name: Run Clippy Linter
        run: |
          cd contracts
          cargo clippy --all-targets -- -D warnings

      - name: Run Contract Unit & Lifecycle Tests
        run: |
          cd contracts
          cargo test

      - name: Build Contract WASM
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release

  contract-client-checks:
    name: TypeScript Contract Client SDK Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install SDK Dependencies
        run: |
          cd packages/contract-client
          npm ci

      - name: Run SDK Typecheck
        run: |
          cd packages/contract-client
          npm run typecheck

      - name: Run SDK Unit Tests
        run: |
          cd packages/contract-client
          npm run test

      - name: Build SDK
        run: |
          cd packages/contract-client
          npm run build

  web-frontend-checks:
    name: Next.js Web Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint Verification
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript Typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Web Unit Tests
        run: |
          cd apps/web
          npm run test

      - name: Production Next.js Build
        env:
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: CBIHLECKLMXYK6FPHSGGVYF6AHNFRHR3T5EIFIS3PFQDFKDQWNR25PHT
        run: |
          cd apps/web
          npm run build

      # ── Secret Zero-Exposure Verification (Issue #166) ───────────────────
      # Inspect the production .next build bundle for accidental secret leaks,
      # including Stellar secret keys matching S[A-Z2-7]{55}.
      - name: Verify Secret Detection Works (self-test)
        run: |
          echo "🧪 Self-test: secret detection with dummy key..."
          # Build a dummy Stellar secret key (S + 55 chars from [A-Z2-7]) at
          # runtime so the literal pattern never appears in this workflow file.
          DUMMY_KEY="S"
          for i in $(seq 1 55); do DUMMY_KEY="${DUMMY_KEY}A"; done
          printf '%s\n' "$DUMMY_KEY" > apps/web/.next/.dummy-secret-check
          if grep -rnP '\bS[A-Z2-7]{55}\b' apps/web/.next > /dev/null 2>&1; then
            echo "✅ Self-test PASS: dummy secret key was detected"
          else
            echo "❌ Self-test FAIL: dummy secret key was NOT detected"
            rm -f apps/web/.next/.dummy-secret-check
            exit 1
          fi
          rm -f apps/web/.next/.dummy-secret-check
          SECRET_PATTERN='\bS[A-Z2-7]{55}\b'
          if ! grep -rnP "$SECRET_PATTERN" apps/web/.next > /dev/null 2>&1; then
            echo "✅ Self-test PASS: clean build has no secret leaks"
          else
            echo "❌ Self-test FAIL: clean build has unexpected matches"
            exit 1
          fi

      - name: Verify No Secret Leaks in Web Build
        run: |
          echo "🔍 Scanning production .next build for leaked secrets..."
          SECRET_PATTERN='\bS[A-Z2-7]{55}\b'
          MATCHES=$(grep -rnP "$SECRET_PATTERN" \
            apps/web/.next 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ SECRET LEAK DETECTED in apps/web/.next"
            echo "$MATCHES"
            echo "Remove all Stellar secret keys from the web output."
            exit 1
          fi
          echo "✅ No secret leaks detected in apps/web/.next"

  go-relay-checks:
    name: Go Relay Service Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: services/relay/go.sum

      - name: Verify Go Formatting
        run: |
          cd services/relay
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd services/relay
          go vet ./...

      - name: Run Go Tests & Race Detector
        run: |
          cd services/relay
          go test -v -race ./...

      - name: Build Relay Daemon Executable
        run: |
          cd services/relay
          go build ./cmd/relay/main.go
