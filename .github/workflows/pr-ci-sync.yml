###############################################################################
# PR CI Status Sync — SorobanAnchor Gate
# =============================================================================
# Runs after "Monorepo CI" finishes (including after maintainer approval for
# first-time contributors or manual job re-runs) and updates the SINGLE sticky
# PR Gate comment with combined Security, Compliance, and CI results.
###############################################################################

name: "🔄 PR CI Status Sync"

on:
  workflow_run:
    workflows: ["Monorepo CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: pr-ci-sync-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  sync-ci-status:
    name: "🔄 Sync CI Status to PR Gate Comment"
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base scripts
        uses: actions/checkout@v7

      - name: Update sticky PR gate comment with CI verdict
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const syncGate = require('./scripts/ci/ci_sync_gate.js');
            await syncGate({ github, context, core });
