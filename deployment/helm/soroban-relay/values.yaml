# Default values for soroban-relay Helm chart.
# Declare variables to be passed into templates.

replicaCount: 2

image:
  repository: ghcr.io/sorobo-gate/soroban-relay
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podLabels:
  app.kubernetes.io/part-of: soroban-anchor-gate

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: relay.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Go Relay Daemon application configuration (mapped to ConfigMap)
config:
  sorobanRpcUrl: "https://soroban-testnet.stellar.org"
  contractId: "CBIHLECKLMXYK6FPHSGGVYF6AHNFRHR3T5EIFIS3PFQDFKDQWNR25PHT"
  port: "8080"
  pollIntervalSeconds: "5"
  startLedger: "0"
  storePath: "/data/relay_store.json"
  otlpEndpoint: ""
  relayEnvironment: "production"
  relayVersion: "1.0.0"

# Secrets management (PostgreSQL & sensitive credentials)
secrets:
  # If set, uses an existing Secret instead of creating one
  existingSecret: ""
  # PostgreSQL database connection string (e.g. postgres://user:pass@host:5432/relay?sslmode=disable)
  databaseUrl: ""

# Persistent volume storage for relay store when using durable file store
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

# Container health and readiness monitoring probes
probes:
  liveness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

nodeSelector: {}
tolerations: []
affinity: {}
