{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soroban-relay.secretName" . }}
  labels:
    {{- include "soroban-relay.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "" | b64enc | quote }}
{{- end }}
